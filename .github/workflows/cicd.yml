name: CI/CD Pipeline

on:
  push:
    branches: [development, uat, production]
  pull_request:
    branches: [development, uat, master, production]

jobs:
  build-and-lint:
    name: Build and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build and test backend (Spring Boot)
        working-directory: backend
        run: ./mvnw clean package

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload backend jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  deploy-dev:
    name: Deploy to Development
    needs: build-and-lint
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/
      - name: Simulate dev deployment
        run: |
          echo "Deploying to DEVELOPMENT environment (simulated — no dev server target defined yet)"
          ls -la dist/

  deploy-uat:
    name: Deploy to UAT
    needs: build-and-lint
    if: github.ref == 'refs/heads/uat' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/
      - name: Simulate UAT deployment
        run: |
          echo "Deploying to UAT environment (simulated, approval gate already satisfied to reach this step)"
          ls -la dist/

  deploy-prod:
    name: Deploy to Production (EC2)
    needs: build-and-lint
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download backend jar artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend-jar/

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend-dist/

      - name: Set release timestamp
        id: vars
        run: echo "RELEASE_NAME=backend-$(date +%Y%m%d-%H%M%S).jar" >> $GITHUB_OUTPUT

      - name: Copy backend jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend-jar/*.jar"
          target: "/opt/devsecops-backend/releases/"
          strip_components: 1

      - name: Copy frontend build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend-dist/*"
          target: "/var/www/devsecops-frontend/"
          strip_components: 1

      - name: Symlink swap, restart service, health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/devsecops-backend
            LATEST_JAR=$(ls -t releases/*.jar | head -n 1)
            ln -sf "$LATEST_JAR" current.jar
            echo "Symlinked current.jar -> $LATEST_JAR"
            sudo systemctl restart devsecops-backend
            sleep 5
            curl -f http://localhost:8080/api/status || (echo "Health check failed!" && exit 1)
            echo "Deployment successful and health check passed."
